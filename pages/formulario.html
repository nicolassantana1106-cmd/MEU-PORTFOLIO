<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Nicolas Henrique</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <div id="site-header"></div>

    <main>
        <section class="hero">
            <h1>Contato</h1>
            <p>Entre em contato comigo através do formulário abaixo.</p>
        </section>

        <section class="contato">
            <h2>Envie sua Mensagem</h2>

            <form id="form-contato" novalidate>

                <p>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" autocomplete="name">
                    <span id="error-nome" class="field-error" aria-live="polite"></span>
                </p>

                <p>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" autocomplete="email">
                    <span id="error-email" class="field-error" aria-live="polite"></span>
                </p>

                <p>
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" autocomplete="tel">
                </p>

                <p>
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" name="idade" min="1" max="120">
                </p>

                <p>
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento">
                </p>

                <p>
                    <label for="area">Área de Interesse:</label>
                    <select id="area" name="area">
                        <option value="">Selecione uma opção</option>
                        <option value="suporte">Suporte de TI</option>
                        <option value="redes">Redes</option>
                        <option value="desenvolvimento">Desenvolvimento Web</option>
                        <option value="programacao">Programação</option>
                    </select>
                    <span id="error-area" class="field-error" aria-live="polite"></span>
                </p>

                <fieldset>
                    <legend>Prioridade do Contato</legend>

                    <div class="opcoes">
                        <label>
                            <input type="radio" name="prioridade" value="baixa">
                            Baixa
                        </label>

                        <label>
                            <input type="radio" name="prioridade" value="media">
                            Média
                        </label>

                        <label>
                            <input type="radio" name="prioridade" value="alta">
                            Alta
                        </label>
                    </div>
                    <span id="error-prioridade" class="field-error" aria-live="polite"></span>
                </fieldset>

                <p class="checkbox">
                    <input type="checkbox" id="novidades" name="novidades">

                    <label for="novidades">
                        Desejo receber novidades por e-mail.
                    </label>
                </p>

                <p>
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="6"></textarea>
                    <span id="error-mensagem" class="field-error" aria-live="polite"></span>
                </p>

                <div class="botoes">
                    <button type="submit">Enviar</button>
                    <button type="reset">Limpar</button>
                </div>

                <p id="form-status" class="form-feedback" aria-live="polite"></p>
            </form>

        </section>

    </main>

    <div id="site-footer"></div>

    <script src="../js/includes.js" data-header-path="../components/header.html" data-footer-path="../components/footer.html"></script>
    <script src="../js/scripts.js"></script>

</body>

</html>
