<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Nicolas Henrique</title>
    <link rel="icon" href="../img/monograma.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <div id="site-header"></div>

    <main id="conteudo" class="page-shell" tabindex="-1">
        <section class="hero">
            <div class="container">
                <p class="eyebrow">Contato</p>
                <h1>Formulário de contato</h1>
                <p class="lede">Entre em contato comigo através do formulário abaixo.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="row g-4 contact-layout">
                    <div class="col-12 col-lg-8 mx-auto">
                        <div class="panel">
                            <h2>Envie sua mensagem</h2>
                            <form id="form-contato" novalidate>
                                <div class="field">
                                    <label for="nome">Nome completo</label>
                                    <input type="text" id="nome" name="nome" autocomplete="name" aria-describedby="error-nome" aria-invalid="false">
                                    <span id="error-nome" class="field-error" aria-live="polite"></span>
                                </div>
                                <div class="field">
                                    <label for="email">E-mail</label>
                                    <input type="email" id="email" name="email" autocomplete="email" aria-describedby="error-email" aria-invalid="false">
                                    <span id="error-email" class="field-error" aria-live="polite"></span>
                                </div>
                                <div class="row g-3">
                                    <div class="col-12 col-md-6">
                                        <div class="field">
                                            <label for="telefone">Telefone</label>
                                            <input type="tel" id="telefone" name="telefone" autocomplete="tel">
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <div class="field">
                                            <label for="idade">Idade</label>
                                            <input type="number" id="idade" name="idade" min="1" max="120">
                                        </div>
                                    </div>
                                </div>
                                <div class="field">
                                    <label for="nascimento">Data de nascimento</label>
                                    <input type="date" id="nascimento" name="nascimento">
                                </div>
                                <div class="field">
                                    <label for="area">Área de interesse</label>
                                    <select id="area" name="area" aria-describedby="error-area" aria-invalid="false">
                                        <option value="">Selecione uma opção</option>
                                        <option value="suporte">Suporte de TI</option>
                                        <option value="redes">Redes</option>
                                        <option value="desenvolvimento">Desenvolvimento web</option>
                                        <option value="programacao">Programação</option>
                                    </select>
                                    <span id="error-area" class="field-error" aria-live="polite"></span>
                                </div>
                                <fieldset aria-describedby="error-prioridade">
                                    <legend>Prioridade do contato</legend>
                                    <div class="opcoes">
                                        <label><input type="radio" name="prioridade" value="baixa" aria-invalid="false"> Baixa</label>
                                        <label><input type="radio" name="prioridade" value="media" aria-invalid="false"> Média</label>
                                        <label><input type="radio" name="prioridade" value="alta" aria-invalid="false"> Alta</label>
                                    </div>
                                    <span id="error-prioridade" class="field-error" aria-live="polite"></span>
                                </fieldset>
                                <p class="checkbox">
                                    <input type="checkbox" id="novidades" name="novidades">
                                    <label for="novidades">Desejo receber novidades por e-mail.</label>
                                </p>
                                <div class="field">
                                    <label for="mensagem">Mensagem</label>
                                    <textarea id="mensagem" name="mensagem" rows="6" aria-describedby="error-mensagem" aria-invalid="false"></textarea>
                                    <span id="error-mensagem" class="field-error" aria-live="polite"></span>
                                </div>
                                <div class="botoes">
                                    <button class="button" type="submit">Enviar</button>
                                    <button class="button button-ghost" type="reset">Limpar</button>
                                </div>
                                <p id="form-status" class="form-feedback" aria-live="polite"></p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>
    <script src="../js/includes.js" data-header-path="../components/header.html" data-footer-path="../components/footer.html"></script>
    <script src="../js/scripts.js"></script>
</body>

</html>
