<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimídia | Nicolas Henrique</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <div id="site-header"></div>

    <main>
        <section class="hero">
            <h1>Multimídia</h1>
            <p>Conteúdos em vídeo, áudio e mídias incorporadas.</p>
        </section>

        <div class="multimidia-container">

            <section>
                <h2>Vídeo</h2>

                <p>Animação Sid MC</p>

                <div class="media-frame video-frame">
                    <iframe
                        src="https://www.youtube.com/embed/6X5krhF4RdA?rel=0"
                        title="Vídeo de animação Sid MC"
                        loading="lazy"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen>
                    </iframe>
                </div>
            </section>

            <section>
                <h2>Áudio</h2>

                <p>Djonga e BK</p>

                <audio controls preload="metadata">
                    <source src="Audio/10%20.%20Djonga%20-%20O%20Mundo%20%C3%A9%20Nosso%20part.%20BK(MP3_128K).mp3" type="audio/mpeg">
                    Seu navegador não suporta áudio.
                </audio>
            </section>

        </div>

        <section>
            <h2>Localização</h2>

            <p>
                Localização exibida através do Google Maps.
            </p>

            <iframe
                class="mapa"
                src="https://www.google.com/maps?q=Sao+Paulo,+SP&output=embed"
                title="Localização no Google Maps"
                loading="lazy"
                allowfullscreen>
            </iframe>

        </section>

    </main>

    <div id="site-footer"></div>

    <script src="../js/includes.js" data-header-path="../components/header.html" data-footer-path="../components/footer.html"></script>
    <script src="../js/scripts.js"></script>

</body>

</html>
